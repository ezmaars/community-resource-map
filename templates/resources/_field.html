{% load i18n %}
<div class="mb-3">
  <label for="{{ field.id_for_label }}" class="form-label">
    {{ field.label }}{% if required %} <span class="required-mark" aria-hidden="true">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}
    <div class="form-text" id="{{ field.id_for_label }}_help">{{ field.help_text }}</div>
  {% endif %}
  {% if field.errors %}
    <div class="invalid-feedback d-block">{{ field.errors|striptags }}</div>
  {% endif %}
</div>
